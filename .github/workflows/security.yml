name: Universal DevSecOps Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev
      - main

jobs:

  # -------------------------
  # SECRET SCAN - GITLEAKS
  # -------------------------
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-git --report-format=json --report-path=gitleaks-report.json --exit-code 1

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


    # -------------------------
  # SAST - CODEQL
  # -------------------------
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect Languages
        id: detect
        run: |
          LANGS=""

          if git ls-files '*.py' | grep -q .; then
            LANGS="$LANGS,python"
          fi

          if git ls-files '*.js' '*.ts' | grep -q .; then
            LANGS="$LANGS,javascript"
          fi

          if git ls-files '*.java' | grep -q .; then
            LANGS="$LANGS,java"
          fi

          if git ls-files '*.go' | grep -q .; then
            LANGS="$LANGS,go"
          fi

          if git ls-files '*.cs' | grep -q .; then
            LANGS="$LANGS,csharp"
          fi

          if git ls-files '*.cpp' '*.cc' '*.cxx' | grep -q .; then
            LANGS="$LANGS,cpp"
          fi

          if git ls-files '*.rb' | grep -q .; then
            LANGS="$LANGS,ruby"
          fi

          LANGS=$(echo $LANGS | sed 's/^,//')

          echo "Detected languages: $LANGS"
          echo "languages=$LANGS" >> $GITHUB_OUTPUT

      - name: Initialize CodeQL
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.detect.outputs.languages }}

      - name: Autobuild
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Analyze
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/analyze@v4

      - name: Fail if vulnerabilities found
        if: steps.detect.outputs.languages != ''
        run: |
          echo "Checking CodeQL alerts..."

          ALERT_COUNT=$(gh api \
            repos/${{ github.repository }}/code-scanning/alerts \
            --jq 'map(select(.state == "open")) | length')

          echo "Open alerts: $ALERT_COUNT"

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "Vulnerabilities detected. Failing SAST."
            exit 1
          else
            echo "No vulnerabilities found."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip SAST
        if: steps.detect.outputs.languages == ''
        run: echo "No supported languages detected. Skipping CodeQL."

  # -------------------------
  # DEPENDENCY SCAN - DEPENDABOT
  # -------------------------
  dependency-scan:
    name: Dependency Scan - Dependabot
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      pull-requests: read

    steps:
      - name: Check Dependabot Alerts
        run: |
          echo "Checking Dependabot alerts..."

          ALERT_COUNT=$(gh api \
            repos/${{ github.repository }}/dependabot/alerts \
            --jq 'map(select(.state == "open")) | length')

          echo "Open Dependabot alerts: $ALERT_COUNT"

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "Vulnerable dependencies detected. Failing dependency scan."
            exit 1
          else
            echo "No vulnerable dependencies found."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # -------------------------
  # NORMALIZATION JOB
  # -------------------------
  normalize:
    name: Normalize Reports
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Normalization Script
        run: python scripts/normalize.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json