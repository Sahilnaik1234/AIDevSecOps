name: Universal DevSecOps Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev

jobs:

  # -------------------------
  # SECRET SCAN - GITLEAKS
  # -------------------------
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-git --report-format=json --report-path=gitleaks-report.json --exit-code 1
      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


   # -------------------------
  # SAST - CODEQL (DYNAMIC)
  # -------------------------
  sast:
    name: SAST - CodeQL (Dynamic)
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Detect Languages
        id: detect
        run: |
          LANGS=""

          if git ls-files '*.py' | grep -q .; then
            LANGS="$LANGS,python"
          fi

          if git ls-files '*.js' '*.ts' | grep -q .; then
            LANGS="$LANGS,javascript"
          fi

          if git ls-files '*.java' | grep -q .; then
            LANGS="$LANGS,java"
          fi

          if git ls-files '*.go' | grep -q .; then
            LANGS="$LANGS,go"
          fi

          if git ls-files '*.cs' | grep -q .; then
            LANGS="$LANGS,csharp"
          fi

          if git ls-files '*.cpp' '*.cc' '*.cxx' | grep -q .; then
            LANGS="$LANGS,cpp"
          fi

          if git ls-files '*.rb' | grep -q .; then
            LANGS="$LANGS,ruby"
          fi

          LANGS=$(echo $LANGS | sed 's/^,//')

          echo "Detected languages: $LANGS"
          echo "languages=$LANGS" >> $GITHUB_OUTPUT

      - name: Initialize CodeQL
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ steps.detect.outputs.languages }}

      - name: Autobuild
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/autobuild@v4

      - name: Analyze
        if: steps.detect.outputs.languages != ''
        uses: github/codeql-action/analyze@v4

      - name: Upload SARIF
        if: steps.detect.outputs.languages != ''
        uses: actions/upload-artifact@v4
        with:
          name: codeql-report
          path: "**/*.sarif"

      - name: Skip SAST (No supported language found)
        if: steps.detect.outputs.languages == ''
        run: echo "No supported languages detected. Skipping CodeQL."


  # -------------------------
  # NORMALIZATION JOB
  # -------------------------
  normalize:
    name: Normalize Reports
    runs-on: ubuntu-latest
    needs: [secret-scan, sast]
    if: always()


    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Normalization Script
        run: python scripts/normalize.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json