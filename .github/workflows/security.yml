name: Universal DevSecOps Security Pipeline

on:
  push:
  pull_request:

jobs:

  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --redact --verbose

  sast:
    name: SAST - CodeQL (Auto Detect)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: auto

      - name: Autobuild (if needed)
        uses: github/codeql-action/autobuild@v3

      - name: Analyze
        uses: github/codeql-action/analyze@v3

  dependency-scan:
    name: Dependency Scan Info
    runs-on: ubuntu-latest
    steps:
      - run: echo "Dependabot handles dependency scanning separately"