name: DevSecOps Security Pipeline

# ============================================================
# PLUG-AND-PLAY DESIGN
# Each security tool is a self-contained job that:
#   1. Runs its scan
#   2. Exports a standardized JSON artifact
#
# To SWAP a tool: replace only that job block.
# To ADD a tool:  add a new job + parse its artifact in normalize.py
# The normalize job always runs last and merges all artifacts.
# ============================================================

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main

jobs:

  # ============================================================
  # JOB 1: SECRET SCANNING — GITLEAKS
  # Swap: replace this job with trufflehog, detect-secrets, etc.
  # Output artifact: gitleaks-report/gitleaks-report.json
  # ============================================================
  secret-scan:
    name: "Secret Scan [Gitleaks]"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # Full history needed for git-mode scanning

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}  # only needed for org/enterprise repos
        with:
          args: >
            detect
            --source=.
            --redact
            --report-format=json
            --report-path=gitleaks-report.json
            --exit-code=0

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn


  # ============================================================
  # JOB 2: SAST — SEMGREP
  # Swap: replace this job with SonarQube, Bandit, Checkov, etc.
  # Output artifact: semgrep-report/semgrep-report.json
  # ============================================================
  sast:
    name: "SAST [Semgrep]"
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write    # Needed to upload SARIF to GitHub Security tab

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Detect languages present in repo
        id: lang-detect
        run: |
          echo "Files found:"
          # Detect every language Semgrep supports
          LANGS=""
          git ls-files | grep -qE '\.py$'            && LANGS="$LANGS python"
          git ls-files | grep -qE '\.(js|jsx|mjs)$'  && LANGS="$LANGS javascript"
          git ls-files | grep -qE '\.(ts|tsx)$'      && LANGS="$LANGS typescript"
          git ls-files | grep -qE '\.java$'          && LANGS="$LANGS java"
          git ls-files | grep -qE '\.go$'            && LANGS="$LANGS go"
          git ls-files | grep -qE '\.(c|h)$'         && LANGS="$LANGS c"
          git ls-files | grep -qE '\.(cpp|cc|cxx)$'  && LANGS="$LANGS cpp"
          git ls-files | grep -qE '\.cs$'            && LANGS="$LANGS csharp"
          git ls-files | grep -qE '\.rb$'            && LANGS="$LANGS ruby"
          git ls-files | grep -qE '\.php$'           && LANGS="$LANGS php"
          git ls-files | grep -qE '\.kt$'            && LANGS="$LANGS kotlin"
          git ls-files | grep -qE '\.rs$'            && LANGS="$LANGS rust"
          git ls-files | grep -qE '\.tf$'            && LANGS="$LANGS terraform"
          git ls-files | grep -qE 'Dockerfile'       && LANGS="$LANGS dockerfile"
          echo "Detected: $LANGS"
          echo "langs=$LANGS" >> $GITHUB_OUTPUT

      - name: Run Semgrep SAST (all detected languages)
        run: |
          # Use explicit public rule packs — NO token needed, works in any CI.
          # These are downloaded from the public Semgrep registry.
          #
          # To SWAP Semgrep: replace this step; output contract = semgrep-report.json
          # To ADD rules:    add more --config p/<ruleset> flags below

          # Build config flags based on languages detected above
          CONFIGS=""
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q python      && CONFIGS="$CONFIGS --config p/python --config p/flask --config p/django"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q javascript  && CONFIGS="$CONFIGS --config p/javascript --config p/nodejs --config p/express"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q typescript  && CONFIGS="$CONFIGS --config p/typescript"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q java        && CONFIGS="$CONFIGS --config p/java --config p/spring"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q go          && CONFIGS="$CONFIGS --config p/golang"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q ruby        && CONFIGS="$CONFIGS --config p/ruby"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q php         && CONFIGS="$CONFIGS --config p/php"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q csharp      && CONFIGS="$CONFIGS --config p/csharp"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q kotlin      && CONFIGS="$CONFIGS --config p/kotlin"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q rust        && CONFIGS="$CONFIGS --config p/rust"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q terraform   && CONFIGS="$CONFIGS --config p/terraform"
          echo "${{ steps.lang-detect.outputs.langs }}" | grep -q dockerfile  && CONFIGS="$CONFIGS --config p/dockerfile"

          # Always include cross-language security packs
          CONFIGS="$CONFIGS --config p/owasp-top-ten --config p/security-audit --config p/secrets"

          # Load custom project rules from .semgrep.yml if it has local rules
          [ -f .semgrep.yml ] && CONFIGS="$CONFIGS --config .semgrep.yml"

          echo "Running semgrep with: $CONFIGS"

          semgrep scan \
            $CONFIGS \
            --json \
            --output semgrep-report.json \
            --metrics=off \
            . || true
        # `|| true` ensures upload step always runs even on findings


      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn


  # ============================================================
  # JOB 3: DEPENDENCY SCAN — pip-audit (Python) + npm audit (JS)
  # Swap: replace steps with Snyk, OWASP Dependency-Check, Trivy, etc.
  # Output artifact: dependency-report/dependency-report.json
  # ============================================================
  dependency-scan:
    name: "Dependency Scan [pip-audit + npm audit]"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      # ---- Python dependency scan ----
      - name: Scan Python dependencies (pip-audit)
        run: |
          if [ -f requirements.txt ]; then
            echo "Scanning requirements.txt..."
            pip-audit -r requirements.txt \
              --format json \
              --output pip-audit-report.json || true
            echo "pip-audit done."
          else
            echo "No requirements.txt found, skipping."
            echo "[]" > pip-audit-report.json
          fi

      # ---- Node.js dependency scan ----
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Scan Node.js dependencies (npm audit)
        run: |
          if [ -f package.json ]; then
            echo "Scanning package.json..."
            npm install --package-lock-only --ignore-scripts 2>/dev/null || true
            npm audit --json > npm-audit-report.json || true
            echo "npm audit done."
          else
            echo "No package.json found, skipping."
            echo '{"vulnerabilities":{}}' > npm-audit-report.json
          fi

      # ---- Merge into single dependency-report.json for normalize.py ----
      - name: Merge dependency reports
        run: |
          python3 - <<'EOF'
          import json, os

          findings = []

          # Parse pip-audit output
          pip_path = "pip-audit-report.json"
          if os.path.isfile(pip_path):
              with open(pip_path) as f:
                  data = json.load(f)
              # pip-audit format: list of {name, version, vulns: [{id, fix_versions, description}]}
              for pkg in data:
                  for v in pkg.get("vulns", []):
                      findings.append({
                          "tool": "pip-audit",
                          "category": "dependency",
                          "severity": "HIGH",
                          "package": pkg.get("name"),
                          "version": pkg.get("version"),
                          "cve": v.get("id"),
                          "description": v.get("description", ""),
                          "fixed_in": ", ".join(v.get("fix_versions", [])),
                          "file": "requirements.txt",
                      })

          # Parse npm audit output
          npm_path = "npm-audit-report.json"
          if os.path.isfile(npm_path):
              with open(npm_path) as f:
                  data = json.load(f)
              vulns = data.get("vulnerabilities", {})
              for pkg_name, info in vulns.items():
                  sev = info.get("severity", "moderate")
                  severity_map = {"critical": "CRITICAL", "high": "HIGH",
                                  "moderate": "MEDIUM", "low": "LOW", "info": "INFO"}
                  for via in info.get("via", []):
                      if isinstance(via, dict):
                          findings.append({
                              "tool": "npm-audit",
                              "category": "dependency",
                              "severity": severity_map.get(sev, "MEDIUM"),
                              "package": pkg_name,
                              "version": info.get("range", ""),
                              "cve": via.get("cve", [None])[0] if via.get("cve") else None,
                              "description": via.get("title", ""),
                              "fixed_in": info.get("fixAvailable", {}).get("version") if isinstance(info.get("fixAvailable"), dict) else None,
                              "file": "package.json",
                          })

          with open("dependency-report.json", "w") as f:
              json.dump(findings, f, indent=2)

          print(f"Dependency report: {len(findings)} finding(s)")
          EOF

      - name: Upload dependency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-report
          path: dependency-report.json
          if-no-files-found: warn



  # ============================================================
  # JOB 4: NORMALIZE — merge all tool reports into one
  # This job is tool-agnostic; add parsing in normalize.py only.
  # ============================================================
  normalize:
    name: "Normalize & Summarize Reports"
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan]
    if: always()    # Run even if scan jobs fail/are skipped

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: scan-artifacts/      # Each artifact downloads into its own subfolder

      - name: List downloaded artifacts
        run: ls -R scan-artifacts/ || echo "No artifacts downloaded"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run normalization script
        run: python scripts/normalize.py
        env:
          ARTIFACTS_DIR: scan-artifacts

      - name: Print summary
        if: always()
        run: |
          echo "===== FINAL SECURITY REPORT SUMMARY ====="
          if [ -f final-security-report.json ]; then
            cat final-security-report.json | python3 -c "
          import json, sys
          r = json.load(sys.stdin)
          s = r['scan_summary']
          print(f\"  Total findings : {s['total']}\")
          print(f\"  Critical       : {s['critical']}\")
          print(f\"  High           : {s['high']}\")
          print(f\"  Medium         : {s['medium']}\")
          print(f\"  Low            : {s['low']}\")
          "
          else
            echo "No report generated."
          fi

      - name: Upload final security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json
          if-no-files-found: warn
