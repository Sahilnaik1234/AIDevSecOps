name: Universal DevSecOps Security Pipeline

on:
  push:
    branches:
      - dev
      - feature/*
  pull_request:
    branches:
      - dev
      - main

jobs:

  # -------------------------
  # SECRET SCAN - GITLEAKS
  # -------------------------
  secret-scan:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        with:
          args: detect --source=. --no-git --report-format=json --report-path=gitleaks-report.json --exit-code 1

      - name: Upload Gitleaks Report
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json


     # -------------------------
  # SAST - CODEQL (Universal Deterministic)
  # -------------------------
  sast:
    name: SAST - CodeQL
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: auto
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4
        continue-on-error: true

      - name: Analyze (Generate SARIF locally)
        uses: github/codeql-action/analyze@v4
        with:
          upload: false

      - name: Fail if vulnerabilities found
        run: |
          SARIF_FILE=$(find $RUNNER_TEMP -name "*.sarif" | head -n 1)

          echo "SARIF file: $SARIF_FILE"

          if [ -z "$SARIF_FILE" ]; then
            echo "No SARIF file generated."
            exit 1
          fi

          COUNT=$(jq '[.runs[].results[]] | length' "$SARIF_FILE")

          echo "Total vulnerabilities found: $COUNT"

          if [ "$COUNT" -gt 0 ]; then
            echo "Vulnerabilities detected. Failing SAST."
            exit 1
          else
            echo "No vulnerabilities found."
          fi

  # -------------------------
  # DEPENDENCY SCAN - DEPENDABOT
  # -------------------------
  dependency-scan:
    name: Dependency Scan - Dependabot
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: read
      pull-requests: read

    steps:
      - name: Check Dependabot Alerts
        run: |
          echo "Checking Dependabot alerts..."

          ALERT_COUNT=$(gh api \
            repos/${{ github.repository }}/dependabot/alerts \
            --jq 'map(select(.state == "open")) | length')

          echo "Open Dependabot alerts: $ALERT_COUNT"

          if [ "$ALERT_COUNT" -gt 0 ]; then
            echo "Vulnerable dependencies detected. Failing dependency scan."
            exit 1
          else
            echo "No vulnerable dependencies found."
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


  # -------------------------
  # NORMALIZATION JOB
  # -------------------------
  normalize:
    name: Normalize Reports
    runs-on: ubuntu-latest
    needs: [secret-scan, sast, dependency-scan]
    if: always()

    steps:
      - uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Run Normalization Script
        run: python scripts/normalize.py

      - name: Upload Final Report
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-security-report.json