# .semgrep.yml — Semgrep rule configuration
#
# PLUG-AND-PLAY: Edit rule packs here without touching security.yml
#
# This config covers ALL major languages automatically.
# Semgrep will only apply rules relevant to files it finds in the repo.
#
# Rule pack reference: https://semgrep.dev/r
# ---------------------------------------------------------------

rules: []   # Local custom rules go here (see examples below)

# ---------------------------------------------------------------
# UNIVERSAL RULE PACKS
# Applied regardless of language — covers all code
# ---------------------------------------------------------------
extends:
  # === Cross-language / Security Focused ===
  - p/default             # Semgrep's curated default rules (all languages)
  - p/owasp-top-ten       # OWASP Top 10 (multi-language coverage)
  - p/security-audit      # Broad security audit rules
  - p/secrets             # Hardcoded secrets (supplements Gitleaks)
  - p/cwe-top-25          # MITRE CWE Top 25 most dangerous weaknesses

  # === Python ===
  - p/python
  - p/flask
  - p/django

  # === JavaScript / TypeScript ===
  - p/javascript
  - p/typescript
  - p/nodejs
  - p/react
  - p/express

  # === Java ===
  - p/java
  - p/spring

  # === Go ===
  - p/golang

  # === Ruby ===
  - p/ruby
  - p/rails

  # === PHP ===
  - p/php

  # === C / C++ ===
  - p/c
  - p/cpp

  # === C# / .NET ===
  - p/csharp

  # === Kotlin ===
  - p/kotlin

  # === Rust ===
  - p/rust

  # === Terraform / Infrastructure-as-Code ===
  - p/terraform

  # === Docker ===
  - p/dockerfile

  # === Generic / Config / Secrets ===
  - p/generic


# ---------------------------------------------------------------
# OPTIONAL: Custom project-specific rules
# Uncomment and fill in to add your own rules without modifying
# security.yml or buying a Semgrep license.
# ---------------------------------------------------------------
# - id: no-hardcoded-env
#   patterns:
#     - pattern: $VAR = "..."
#   message: "Possible hardcoded value in $VAR"
#   languages: [python, javascript, java, go]
#   severity: WARNING
