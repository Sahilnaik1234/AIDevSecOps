# .semgrep.yml — Custom Semgrep Rules (OPTIONAL)
#
# This file defines ADDITIONAL project-specific rules on top of
# the auto-detected rules run in security.yml via `--config auto`.
#
# `--config auto` already covers ALL languages automatically.
# Add custom rules here ONLY when you need project-specific checks.
#
# Format reference: https://semgrep.dev/docs/writing-rules/rule-syntax/
# ---------------------------------------------------------------

rules:
  # Example: catch any hardcoded "TODO: fix security" comments
  - id: no-security-todo
    patterns:
      - pattern-regex: "(?i)TODO.*security.*fix"
    message: "Unresolved security TODO found: $0"
    languages: [python, javascript, typescript, java, go, ruby, php, c, cpp]
    severity: WARNING

  # Example: disallow use of MD5 for hashing across all languages
  - id: no-md5-hashing
    patterns:
      - pattern-regex: "md5|MD5"
    message: "MD5 is cryptographically broken. Use SHA-256 or bcrypt."
    languages: [python, javascript, typescript, java, go]
    severity: ERROR
    metadata:
      cwe: "CWE-328"
      owasp: "A02:2021"
